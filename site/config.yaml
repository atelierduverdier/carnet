# =====================================================================
# config.yaml — les réglages du site
# =====================================================================
# Le seul endroit où se décident le nom, le domaine, les langues et la
# page d'accueil de chacune. Le générateur ne devine rien : tout ce qui
# est écrit ici se retrouve dans les pages, et dans l'atelier.
# =====================================================================

titre: "Le Carnet du Verdier"
devise: "Pense-bêtes Linux d'un atelier : ce qui a marché, et pourquoi."
domaine: "https://carnet.atelierduverdier.fr"
courriel: "leverdier@ik.me"

# Le thème du site : un dossier dans themes/.
theme: "carnet"

# =====================================================================
# LE SITE EST MASQUÉ AUX MOTEURS — réglage temporaire, à retirer
# =====================================================================
# En ligne, mais pas encore montrable : le carnet se remplit. robots.txt
# refuse tout, chaque page porte « noindex, nofollow », et le plan du
# site n'est pas écrit. Le générateur le rappelle à chaque passage.
#
# LE RETIRER EST UN GESTE, PAS UN OUBLI : tant que cette ligne est là,
# le carnet ne sera trouvé par personne. Supprimer la ligne, régénérer,
# republier — et penser à poser la carte du portail et le lien de la
# page « liens », préparés sur la branche `carnet-a-annoncer` de leurs
# dépôts respectifs.
moteurs: "non"

langue_par_defaut: fr

# UNE langue suffit. Pour en ajouter une, ajouter son bloc ici et créer
# le dossier site/contenu/<code>/ — l'atelier fera le reste (jumelage
# des pages, pastilles, mention de traduction automatique).
#
# Une langue sans « accueil » n'est PAS engendrée : la valeur est le
# `slug` de la page qui sert d'accueil.
langues:
  fr:
    nom: "Français"
    accueil: "accueil"
    titre: "Le Carnet du Verdier"
    devise: "Pense-bêtes Linux d'un atelier : ce qui a marché, et pourquoi."
  en:
    nom: "English"
    accueil: "home"
    titre: "The Verdier Notebook"
    # La devise DOIT être traduite : tant que les deux langues portent la
    # même, les deux accueils ont le même <title> et le vérificateur le
    # signale — à juste titre.
    devise: "Linux notes from a workshop: what worked, and why."
    # Chaque langue nomme SA rubrique en vedette : les slugs diffèrent.
    a_la_une: "troubleshooting"
# La rubrique dont les fiches s'affichent en tuiles sur l'accueil, et
# combien. Retirer ce bloc si le site n'a pas d'actualités.
a_la_une:
  collection: "depannage"
  nombre: 4
