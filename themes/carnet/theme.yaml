nom: "Carnet"
description: >
  La charte de l'Atelier du Verdier — orange #ff8a00 sur ardoise #2f3540 —
  posée sur Verdure, plus ce que Verdure n'a pas : un mode sombre. Il
  n'apporte QUE sa feuille de style ; gabarits, script, polices et images
  viennent de son parent.
auteur: "L'Atelier du Verdier"
herite: verdure
